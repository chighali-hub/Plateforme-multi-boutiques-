[pytest]
# --ds impose les parametres de test. Il l'emporte sur la variable
# d'environnement DJANGO_SETTINGS_MODULE, que le fichier .env fixe a
# config.settings.dev dans les conteneurs Docker.
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
testpaths = apps
addopts = -ra --strict-markers --reuse-db --ds=config.settings.test
